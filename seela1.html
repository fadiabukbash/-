<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>من رموز المقاومة والتضحية | عرض تفاعلي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--b1:#0e3b38;--b2:#17564f;--tx:#f4fbf8;--mut:#c3e2da;--ac:#f0643a;--ok:#3ec97b;--cd:#ffffff17;--bd:#ffffff36;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--b1:#071f1d;--b2:#0e332f}}
:root[data-theme="dark"]{--b1:#071f1d;--b2:#0e332f}
*{box-sizing:border-box}html,body{height:100%;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:linear-gradient(160deg,var(--b1),var(--b2));color:var(--tx);font-family:Tajawal,"Segoe UI",Tahoma,Arial,sans-serif;font-size:clamp(16px,2.1vw,22px);line-height:1.8;overflow:hidden}
#deck{position:relative;height:calc(100% - 64px)}
.sl{position:absolute;inset:0;overflow:auto;padding:18px clamp(14px,5vw,70px);visibility:hidden;opacity:0;transition:opacity .5s,visibility .5s;display:flex;flex-direction:column;align-items:center}
.sl.on{visibility:visible;opacity:1}
.sl>*{width:100%;max-width:980px}
h1{font-size:clamp(26px,5.5vw,52px);line-height:1.5;margin:8px 0;font-weight:800}
h2{font-size:clamp(23px,4vw,38px);margin:4px 0 10px;font-weight:800}
.mut{color:var(--mut)}
.a{opacity:0}.sl.on .a{animation:in .7s forwards;animation-delay:calc(var(--i)*.14s)}
@keyframes in{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.cover{justify-content:center;text-align:center}
.orb{width:120px;height:120px;border-radius:50%;margin:0 auto 10px;background:radial-gradient(circle,var(--ac) 0 28%,transparent 30%);position:relative}
.orb:before,.orb:after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--ac);animation:rg 2.6s infinite}
.orb:after{animation-delay:1.3s}
@keyframes rg{from{transform:scale(.4);opacity:1}to{transform:scale(1.5);opacity:0}}
.credit{margin-top:18px;background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:12px 18px;display:inline-block;max-width:560px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:12px 16px;text-align:start;font:inherit;color:inherit;cursor:pointer}
.cd b{display:block;font-size:1.08em}.cd .dt{display:none;color:var(--mut);margin-top:6px}.cd.open{border-color:var(--ac);background:#ffffff26}.cd.open .dt{display:block;animation:in .4s}
.tl{display:flex;gap:8px;overflow-x:auto;padding:6px 0 10px}
.tl button{flex:1 0 auto;background:var(--cd);border:2px solid var(--bd);color:inherit;font:inherit;font-weight:700;border-radius:14px;padding:4px 14px;cursor:pointer}
.tl button.on{background:var(--ac);border-color:var(--ac)}
.pn{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px 18px;min-height:7.5em}
.pn h3{margin:0 0 4px;color:#ffd0bf}
.chain{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:12px;font-weight:700}
.chain span{background:var(--ac);border-radius:10px;padding:2px 12px}
.opt{display:block;width:100%;text-align:start;margin:7px 0;background:var(--cd);border:2px solid var(--bd);color:inherit;font:inherit;border-radius:12px;padding:5px 14px;cursor:pointer}
.opt.ok{border-color:var(--ok);background:#3ec97b33}.opt.no{border-color:var(--ac);background:#f0643a33}
.row{display:flex;gap:10px;flex-wrap:wrap}.row .opt{flex:1 1 140px;text-align:center}
.fb{min-height:1.8em;font-weight:700}
.stars{font-size:34px;letter-spacing:6px}
#bar{height:64px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 10px;background:#00000040;flex-wrap:nowrap}
#bar button{background:var(--cd);border:1px solid var(--bd);color:inherit;font:inherit;border-radius:12px;padding:2px 12px;cursor:pointer;white-space:nowrap}
#bar .p{background:var(--ac);border-color:var(--ac);font-weight:700}
#dots{display:flex;gap:6px;margin:0 6px}#dots i{width:10px;height:10px;border-radius:50%;background:#ffffff44;transition:.3s}#dots i.on{background:var(--ac);transform:scale(1.4)}
@media (max-width:520px){#bar button{padding:2px 8px;font-size:14px}#dots{display:none}}
@media (prefers-reduced-motion:reduce){.a,.sl.on .a{animation:none;opacity:1}.orb:before,.orb:after{animation:none}}
.emb{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:50px;font-weight:800;color:#fff;margin:4px auto 6px;position:relative;background:var(--ac)}
.emb:after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--ac);animation:rg 2.6s infinite}
.er{display:flex;gap:12px;justify-content:center;margin:10px 0}.er .emb{width:58px;height:58px;font-size:30px;margin:0}.er .emb:after{display:none}
.sl.pr{text-align:center}.sl.pr .cards,.sl.pr .pn{text-align:start}
.meta{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px auto}.meta span{background:var(--cd);border:1px solid var(--bd);border-radius:20px;padding:0 14px}
</style></head><body>
<div id="deck">
<section class="sl cover on">
<div class="orb a"></div>
<h1 class="a">من رموز المقاومة والتضحية</h1>
<p class="a" style="font-size:1.15em">عمر المختار — محمد جمجوم — عطا الزير — فؤاد حجازي</p>
<div class="er a" id="er"></div>
<p class="a mut">الصف التاسع — عرض تفاعلي بالصوت والحركة</p>
<div class="a"><div class="credit"><b>إعداد وتصميم: سيلا فادي</b><br>مدرسة رجب المحتسب للبنات</div></div>
</section>
<i id="mk"></i>
<section class="sl">
<h2 class="a">🏅 نراجع ما تعلمناه</h2>
<p class="a">جمعت هؤلاء الأبطال المقاومة والتضحية من أجل الحرية والكرامة.</p>
<div class="a"><b id="qt"></b><div id="qo"></div><div class="fb" id="f2"></div><div class="stars" id="st"></div></div>
</section>
</div>
<div id="bar"><button id="pv">▶ السابق</button><button class="p" id="sp">🔊 اسمعي الشرح</button><div id="dots"></div><button id="au">⏯ تلقائي</button><button id="nx">التالي ◀</button></div>
<script>
const $=s=>document.querySelector(s);
const P=[
{n:'عمر المختار',t:'«أسد الصحراء» — قائد المقاومة الليبية ضد الاستعمار الإيطالي',m:['📅 وُلد نحو عام ١٨٥٨م','📍 ليبيا (برقة)','🕊️ استُشهد في ١٦ أيلول ١٩٣١م'],
f:[['📖 من هو؟','معلّم للقرآن الكريم ومن أتباع الحركة السنوسية، عُرف بتقواه وحكمته وخبرته بالصحراء.'],['⚔️ ماذا فعل؟','قاد المقاومة ضد الاحتلال الإيطالي لليبيا نحو عشرين عامًا منذ عام ١٩١١م، واعتمد حرب العصابات في الجبل الأخضر.'],['🔗 كيف أُسر؟','أقام الإيطاليون أسلاكًا شائكة ومعسكرات اعتقال لقطع الإمداد عن المقاومة، ثم أُسر في أيلول ١٩٣١م.'],['⚖️ نهايته','حوكم محاكمة سريعة وأُعدم شنقًا وهو في نحو الثالثة والسبعين من عمره، فبقي رمزًا لرفض الاستسلام.']],
q:'📜 من أقواله المنسوبة إليه: «نحن لا نستسلم، ننتصر أو نموت».'},
{n:'محمد جمجوم',t:'أحد شهداء «الثلاثاء الحمراء» — من مدينة الخليل',m:['📅 وُلد عام ١٩٠٢م','📍 الخليل','🕊️ أُعدم في ١٧ حزيران ١٩٣٠م'],
f:[['📖 من هو؟','شاب فلسطيني من الخليل، اتهمته سلطات الانتداب البريطاني بالمشاركة في أحداث ثورة البراق عام ١٩٢٩م.'],['🌋 الخلفية','اندلعت ثورة البراق دفاعًا عن المسجد الأقصى وحائط البراق، وكانت من محطات المقاومة الفلسطينية ضد سياسات الانتداب.'],['⚖️ الحكم','حكمت المحكمة على ٢٦ فلسطينيًا بالإعدام، خُفِّف الحكم عن ٢٣ ونُفِّذ في ثلاثة: جمجوم والزير وحجازي.'],['🚪 يوم الإعدام','نُفِّذ الحكم في سجن عكا يوم الثلاثاء ١٧ حزيران ١٩٣٠م، فعمّ الإضراب والحداد فلسطين وسُمّي «الثلاثاء الحمراء».']],
q:'🎵 خلّدت الأغنية الشعبية «من سجن عكا» ذكرى الشهداء الثلاثة.'},
{n:'عطا الزير',t:'أكبر الشهداء الثلاثة سنًا — من مدينة الخليل',m:['📅 وُلد عام ١٨٩٥م','📍 الخليل','🕊️ أُعدم في ١٧ حزيران ١٩٣٠م'],
f:[['📖 من هو؟','فلسطيني من الخليل، كان أكبر الثلاثة سنًا، وعُرف بشجاعته وثباته.'],['⚖️ التهمة','اتُّهم بالمشاركة في أحداث ثورة البراق، وصدر بحقه حكم الإعدام مع رفيقيه.'],['🕯️ في السجن','تروي الروايات أن الثلاثة واجهوا الإعدام بثبات وإيمان، ولم يتراجعوا عن موقفهم.'],['🌟 الأثر','صاروا رمزًا للتضحية، وكتب الشاعر إبراهيم طوقان قصيدة «الثلاثاء الحمراء» تخليدًا لهم.']],
q:'📜 يُحيي الفلسطينيون ذكراهم كل عام في ١٧ حزيران.'},
{n:'فؤاد حجازي',t:'ابن مدينة صفد — أصغر الشهداء الثلاثة',m:['📅 وُلد عام ١٩٠٤م','📍 صفد','🕊️ أُعدم في ١٧ حزيران ١٩٣٠م'],
f:[['📖 من هو؟','شاب من مدينة صفد في الجليل، وكان أصغر الثلاثة سنًا.'],['🗺️ من الشمال إلى الجنوب','يدل اسمه على أن المقاومة شملت مدنًا فلسطينية مختلفة: الخليل في الجنوب وصفد في الشمال.'],['⚖️ الحكم','اتُّهم بالمشاركة في أحداث عام ١٩٢٩م في صفد، وحكم عليه الانتداب البريطاني بالإعدام.'],['🕊️ أثره','تحوّل يوم إعدامهم إلى ذكرى وطنية سنوية، وزادت قصتهم الفلسطينيين تمسكًا بحقوقهم.']],
q:'💬 فكّري: ما معنى أن يضحّي الإنسان بحياته من أجل وطنه؟'}];
const CL=['#e4572e','#2e9e5b','#3b82c4','#b8860b'],IN=['ع','م','ع','ف'];
$('#er').innerHTML=IN.map((c,k)=>`<div class="emb" style="background:${CL[k]}">${c}</div>`).join('');
$('#mk').insertAdjacentHTML('beforebegin',P.map((p,k)=>`<section class="sl pr"><div class="emb a" style="background:${CL[k]}">${IN[k]}</div><h2 class="a">${p.n}</h2><p class="a mut">${p.t}</p><div class="meta a">${p.m.map(x=>'<span>'+x+'</span>').join('')}</div><p class="a mut">اضغطي على كل بطاقة:</p><div class="cards a">${p.f.map(f=>`<button class="cd"><b>${f[0]}</b><span class="dt">${f[1]}</span></button>`).join('')}</div><div class="pn a" style="margin-top:12px;min-height:0">${p.q}</div></section>`).join(''));
const S=[...document.querySelectorAll('.sl')];
const N=['السلام عليكم. في هذا العرض نتعرف إلى أربعة من رموز المقاومة والتضحية: عمر المختار في ليبيا، ومحمد جمجوم وعطا الزير وفؤاد حجازي في فلسطين. من إعداد وتصميم سيلا فادي، مدرسة رجب المحتسب للبنات.',...P.map(p=>p.n+'. '+p.t+'. '+p.f.map(f=>f[1]).join(' ')+' '+p.q.replace(/[«»]/g,'')),'لنراجع ما تعلمناه. أجيبي عن الأسئلة. وتجمع هؤلاء الأبطال المقاومة والتضحية من أجل الحرية والكرامة. شكرًا لكنّ.'];
let i=0,auto=false,AC;const SS=window.speechSynthesis;
function beep(f){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.09;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.18);o.stop(AC.currentTime+.2)}catch(e){}}
S.forEach(s=>[...s.querySelectorAll('.a')].forEach((e,k)=>e.style.setProperty('--i',k)));
$('#dots').innerHTML=S.map(()=>'<i></i>').join('');
function stop(){try{SS&&SS.cancel()}catch(e){}$('#sp').textContent='🔊 اسمعي الشرح'}
function say(){if(!SS){$('#sp').textContent='الصوت غير مدعوم';return}stop();const u=new SpeechSynthesisUtterance(N[i]);u.lang='ar-SA';u.rate=.92;const v=SS.getVoices().find(v=>v.lang&&v.lang.startsWith('ar'));if(v)u.voice=v;u.onend=()=>{$('#sp').textContent='🔊 اسمعي الشرح';if(auto)setTimeout(()=>{if(auto&&i<S.length-1)go(i+1,1)},1200)};$('#sp').textContent='⏸ إيقاف';SS.speak(u)}
function go(k,speak){if(k<0||k>=S.length)return;stop();S[i].classList.remove('on');i=k;const s=S[i];s.classList.add('on');s.scrollTop=0;[...s.querySelectorAll('.a')].forEach(e=>{e.style.animation='none';void e.offsetWidth;e.style.animation=''});[...$('#dots').children].forEach((d,j)=>d.classList.toggle('on',j==i));$('#pv').disabled=i==0;$('#nx').disabled=i==S.length-1;beep(520);if(speak)say()}
$('#nx').onclick=()=>go(i+1);$('#pv').onclick=()=>go(i-1);
$('#sp').onclick=()=>SS&&SS.speaking?stop():say();
$('#au').onclick=()=>{auto=!auto;$('#au').style.background=auto?'var(--ok)':'';if(auto){say()}else stop()};
addEventListener('keydown',e=>{if(e.key=='ArrowLeft')go(i+1);if(e.key=='ArrowRight')go(i-1)});
let x0;addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>90&&!e.target.closest('.tl'))go(d<0?i+1:i-1)});
document.querySelectorAll('.cd').forEach(c=>c.onclick=()=>{c.classList.toggle('open');beep(660)});
const Q=[['قاد المقاومة الليبية ضد الاستعمار الإيطالي:',['عمر المختار','عطا الزير','فؤاد حجازي'],0],['نُفِّذ حكم الإعدام بالأبطال الثلاثة في سجن:',['القدس','عكا','غزة'],1],['من أبناء مدينة صفد:',['محمد جمجوم','عمر المختار','فؤاد حجازي'],2],['لُقّب عمر المختار بـ:',['صقر قريش','أسد الصحراء','سيف الله'],1]];
let qi=0,sc=0;
function qn(){if(qi<Q.length){$('#qt').textContent=(qi+1)+') '+Q[qi][0];$('#qo').innerHTML=Q[qi][1].map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join('')}else{$('#qt').textContent='انتهى التقويم!';$('#qo').innerHTML='';$('#st').textContent='⭐'.repeat(sc)+'☆'.repeat(Q.length-sc);$('#f2').textContent='نتيجتك: '+sc+' من '+Q.length+(sc==Q.length?' — ممتازة! 🌟':' — حاولي مرة أخرى.')}}
qn();
$('#qo').onclick=e=>{const b=e.target.closest('.opt');if(!b||qi>=Q.length)return;const ok=+b.dataset.k==Q[qi][2];b.classList.add(ok?'ok':'no');if(ok)sc++;$('#f2').textContent=ok?'✅ إجابة صحيحة':'❌ إجابة خاطئة';beep(ok?880:220);qi++;setTimeout(()=>{if(qi<Q.length)$('#f2').textContent='';qn()},900)};
try{SS&&SS.getVoices()}catch(e){}go(0);
</script></body></html>
