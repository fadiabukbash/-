<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة ترتيب خطوات الوضوء للأطفال</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }
        body {
            font-family: 'Cairo', sans-serif;
            touch-action: manipulation;
            overscroll-behavior-y: none;
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #e0e7ff 100%);
        }
        
        .step-card {
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            touch-action: none;
            box-shadow: 0 8px 0 rgba(0,0,0,0.12), 0 12px 18px rgba(0,0,0,0.08);
        }
        .step-card:hover {
            transform: translateY(-4px) scale(1.02);
        }
        .step-card:active {
            transform: translateY(2px) scale(0.98);
            box-shadow: 0 3px 0 rgba(0,0,0,0.1);
        }
        
        .bounce-fun {
            animation: bounceFun 0.8s infinite alternate cubic-bezier(0.45, 0.05, 0.55, 0.95);
        }
        @keyframes bounceFun {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-10px) scale(1.05); }
        }

        .pulse-btn {
            animation: pulseBtn 1.2s ease-in-out infinite;
        }
        @keyframes pulseBtn {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .pop-in {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.35);
        }
        @keyframes popIn {
            0% { transform: scale(0) rotate(-5deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .shake {
            animation: shake 0.5s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px) rotate(-2deg); }
            40%, 80% { transform: translateX(10px) rotate(2deg); }
        }

        .water-bg {
            background-image: radial-gradient(#3b82f6 15%, transparent 16%), radial-gradient(#06b6d4 15%, transparent 16%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            opacity: 0.1;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-gray-800 overflow-x-hidden relative">
    
    <div class="absolute inset-0 water-bg pointer-events-none"></div>

    <header class="bg-gradient-to-r from-blue-600 via-sky-600 to-cyan-500 text-white py-3 px-4 sm:px-6 shadow-xl sticky top-0 z-20 border-b-4 border-yellow-300">
        <div class="max-w-4xl mx-auto flex justify-between items-center gap-2">
            <div class="flex items-center space-x-2 space-x-reverse min-w-0 flex-1">
                <span class="text-3xl sm:text-4xl shrink-0 bounce-fun">💧</span>
                <div class="min-w-0 flex-1">
                    <h1 class="text-base sm:text-2xl font-black leading-snug break-words text-white drop-shadow-md">تعلم خطوات الوضوء الصحيحة</h1>
                    <p class="text-[11px] sm:text-xs text-cyan-100 font-bold truncate">رتب الخطوات بالترتيب الصحيح 🌊</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2 space-x-reverse bg-white/20 backdrop-blur-md py-1.5 px-3 rounded-2xl border-2 border-white/40 shrink-0 shadow-inner">
                <div class="text-center">
                    <span class="block text-[10px] sm:text-xs text-yellow-200 font-bold leading-none mb-1">النقاط ⭐</span>
                    <span id="score" class="text-lg sm:text-2xl font-black text-yellow-300 leading-none drop-shadow">٠</span>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-4xl w-full mx-auto p-3 sm:p-5 flex-grow flex flex-col justify-between items-center gap-4 z-10">
        
        <div class="bg-white/95 rounded-2xl sm:rounded-3xl p-3.5 sm:p-5 shadow-xl w-full text-center border-4 border-sky-400">
            <div class="text-base sm:text-xl font-black text-blue-950 flex items-center justify-center gap-2 flex-wrap">
                <span class="text-2xl sm:text-3xl">🎯</span>
                <span>اضغط على الخطوات بالترتيب الصحيح للوضوء:</span>
            </div>
        </div>

        <div class="w-full bg-white/90 backdrop-blur-md p-3.5 sm:p-5 rounded-2xl sm:rounded-3xl shadow-xl border-4 border-blue-200">
            <div class="flex justify-between items-center mb-3 px-1">
                <p class="text-xs sm:text-base font-black text-blue-900 flex items-center gap-1">
                    <span>✨</span> ترتيبك الحالي (اضغط للعديل):
                </p>
                <button id="clear-btn" onclick="clearSelection()" class="text-xs sm:text-sm font-black text-red-600 hover:text-red-800 bg-red-100 hover:bg-red-200 px-3 py-1.5 rounded-xl border-2 border-red-300 hidden shrink-0 shadow-sm transition active:scale-95">
                    تفريغ الكل 🗑️
                </button>
            </div>
            
            <div id="target-slots" class="flex flex-col gap-2 py-1"></div>
        </div>

        <div class="w-full bg-sky-200/60 backdrop-blur-sm p-3.5 sm:p-5 rounded-2xl sm:rounded-3xl border-4 border-sky-300 shadow-md">
            <p class="text-center text-xs sm:text-base font-black text-blue-900 mb-3 flex items-center justify-center gap-1">
                <span>👇</span> اختر الخطوة التالية:
            </p>
            <div id="source-cards" class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 sm:gap-3 min-h-[100px]"></div>
        </div>

        <div class="w-full flex justify-center items-center my-1">
            <button id="check-btn" onclick="checkAnswer()" disabled class="bg-gray-300 text-gray-500 font-black py-3 px-8 sm:py-4 sm:px-12 rounded-2xl shadow-lg text-lg sm:text-2xl transition duration-300 cursor-not-allowed w-full max-w-sm">
                تحقق من الترتيب ✨
            </button>
        </div>

        <div id="feedback" class="min-h-[45px] sm:min-h-[55px] text-center font-black text-base sm:text-2xl transition-all flex items-center justify-center px-3 rounded-2xl"></div>

    </main>

    <footer class="p-3 sm:p-4 text-center pb-6 flex flex-col items-center gap-3 z-10">
        <button id="reset-btn" onclick="startNewGame()" class="bg-gradient-to-r from-sky-400 to-blue-500 hover:from-sky-500 hover:to-blue-600 active:scale-95 text-white font-black py-2.5 px-7 rounded-full shadow-lg text-sm sm:text-base transition duration-200 inline-flex items-center gap-2 border-2 border-white">
            <span>🔄</span> إعادة الترتيب
        </button>

        <div class="text-xs sm:text-base font-black text-blue-950 bg-white/90 px-5 py-2 rounded-full border-2 border-blue-300 inline-flex items-center gap-2 shadow-md">
            <span>✨</span>
            <span>تصميم الأستاذ: فادي أبو الكباش</span>
            <span>✨</span>
        </div>
    </footer>

    <div id="success-modal" class="fixed inset-0 bg-black/70 backdrop-blur-md hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-xs sm:max-w-md w-full text-center shadow-2xl border-8 border-cyan-400 transform transition-all pop-in">
            <div class="text-6xl sm:text-7xl mb-2 bounce-fun">🌟</div>
            <h2 class="text-2xl sm:text-4xl font-black text-blue-950 mb-2">ممتاز جداً يا بطل!</h2>
            <p id="modal-phrase" class="text-sky-600 font-black mb-5 text-base sm:text-xl">تعلمت خطوات الوضوء بنجاح! 🌊</p>
            
            <p class="text-xs sm:text-sm font-black text-blue-900 mb-5 bg-blue-100/80 py-2 px-3 rounded-xl border border-blue-300 shadow-sm">
                🎨 تصميم: الأستاذ فادي أبو الكباش
            </p>

            <button onclick="startNewGame(); document.getElementById('success-modal').classList.add('hidden');" class="w-full bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-600 hover:to-blue-700 text-white font-black py-3.5 sm:py-4 rounded-2xl shadow-xl text-lg sm:text-2xl transition transform active:scale-95 border-b-4 border-blue-800">
                العب مرة أخرى 🚀
            </button>
        </div>
    </div>

    <script>
        const wuduSteps = [
            { id: 1, text: "النيّة والبسملة (قول: بسم الله)", icon: "🤲" },
            { id: 2, text: "غسل الكفين ثلاث مرات", icon: "🧼" },
            { id: 3, text: "المضمضة (غسل الفم) ثلاث مرات", icon: "💧" },
            { id: 4, text: "الاستنشاق والاستنثار (غسل الأنف)", icon: "😤" },
            { id: 5, text: "غسل الوجه ثلاث مرات", icon: "😊" },
            { id: 6, text: "غسل اليدين إلى المرفقين ثلاث مرات", icon: "💪" },
            { id: 7, text: "مسح الرأس والأذنين مرة واحدة", icon: "💆‍♂️" },
            { id: 8, text: "غسل الرجلين إلى الكعبين ثلاث مرات", icon: "🦶" }
        ];

        let score = 0;
        let shuffledSteps = [];
        let userSelection = [];

        function toHindiNumeral(num) {
            const hindiDigits = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
            return num.toString().replace(/\d/g, digit => hindiDigits[parseInt(digit)]);
        }

        const playSound = (type) => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();

                if (type === 'click') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.setValueAtTime(450, ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);

                } else if (type === 'correct') {
                    const notes = [523.25, 659.25, 783.99, 1046.5];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.08);
                        gain.gain.setValueAtTime(0.12, ctx.currentTime + idx * 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.08 + 0.25);
                        osc.start(ctx.currentTime + idx * 0.08);
                        osc.stop(ctx.currentTime + idx * 0.08 + 0.25);
                    });

                } else if (type === 'wrong') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.setValueAtTime(220, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(130, ctx.currentTime + 0.25);
                    gain.gain.setValueAtTime(0.12, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.25);
                }
            } catch (e) {}
        };

        function initGame() {
            shuffledSteps = [...wuduSteps];
            shuffleArray(shuffledSteps);
            userSelection = [];
            renderSlots();
            renderSourceCards();
            updateCheckButtonState();
            clearFeedback();
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function renderSlots() {
            const container = document.getElementById('target-slots');
            container.innerHTML = '';

            for (let i = 0; i < wuduSteps.length; i++) {
                const isFilled = i < userSelection.length;
                const step = isFilled ? userSelection[i] : null;

                const slot = document.createElement('div');
                slot.className = `p-2.5 sm:p-3 rounded-xl border-2 flex items-center justify-between transition-all duration-200 ${
                    isFilled 
                    ? 'bg-blue-50 border-blue-500 text-blue-900 shadow-sm cursor-pointer hover:bg-red-50 hover:border-red-400' 
                    : 'bg-gray-50 border-dashed border-gray-300 text-gray-400'
                }`;

                if (isFilled) {
                    slot.innerHTML = `
                        <div class="flex items-center gap-2">
                            <span class="w-6 h-6 rounded-full bg-blue-600 text-white font-black text-xs flex items-center justify-center shrink-0">${toHindiNumeral(i + 1)}</span>
                            <span class="text-xl shrink-0">${step.icon}</span>
                            <span class="font-bold text-xs sm:text-base">${step.text}</span>
                        </div>
                        <span class="text-xs text-red-500 font-bold">حذف ❌</span>
                    `;
                    slot.onclick = () => unselectStepAt(i);
                } else {
                    slot.innerHTML = `
                        <div class="flex items-center gap-2">
                            <span class="w-6 h-6 rounded-full bg-gray-200 text-gray-500 font-bold text-xs flex items-center justify-center shrink-0">${toHindiNumeral(i + 1)}</span>
                            <span class="font-bold text-xs sm:text-sm text-gray-400">الخطوة رقم (${toHindiNumeral(i + 1)})</span>
                        </div>
                    `;
                }

                container.appendChild(slot);
            }

            const clearBtn = document.getElementById('clear-btn');
            if (userSelection.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }
        }

        function renderSourceCards() {
            const container = document.getElementById('source-cards');
            container.innerHTML = '';

            shuffledSteps.forEach((step) => {
                const isSelected = userSelection.some(s => s.id === step.id);

                if (!isSelected) {
                    const card = document.createElement('div');
                    card.className = `step-card bg-white p-3 rounded-2xl border-2 border-sky-300 font-bold text-xs sm:text-base text-gray-800 flex items-center gap-2.5 cursor-pointer active:scale-95 pop-in`;
                    card.innerHTML = `
                        <span class="text-2xl shrink-0">${step.icon}</span>
                        <span class="leading-tight">${step.text}</span>
                    `;
                    card.onclick = () => selectStep(step);
                    container.appendChild(card);
                }
            });
        }

        function selectStep(step) {
            if (userSelection.length < wuduSteps.length) {
                playSound('click');
                userSelection.push(step);
                clearFeedback();
                renderSlots();
                renderSourceCards();
                updateCheckButtonState();
            }
        }

        function unselectStepAt(index) {
            playSound('click');
            userSelection.splice(index, 1);
            clearFeedback();
            renderSlots();
            renderSourceCards();
            updateCheckButtonState();
        }

        function clearSelection() {
            playSound('click');
            userSelection = [];
            clearFeedback();
            renderSlots();
            renderSourceCards();
            updateCheckButtonState();
        }

        function updateCheckButtonState() {
            const checkBtn = document.getElementById('check-btn');
            if (userSelection.length === wuduSteps.length) {
                checkBtn.disabled = false;
                checkBtn.className = "bg-gradient-to-r from-sky-500 via-blue-500 to-sky-600 hover:from-sky-600 hover:to-blue-700 active:scale-95 text-white font-black py-3 px-8 sm:py-4 sm:px-12 rounded-2xl shadow-xl text-lg sm:text-2xl transition duration-300 pulse-btn cursor-pointer w-full max-w-sm border-b-4 border-blue-800";
            } else {
                checkBtn.disabled = true;
                checkBtn.className = "bg-gray-300 text-gray-500 font-black py-3 px-8 sm:py-4 sm:px-12 rounded-2xl shadow-md text-lg sm:text-2xl transition duration-300 cursor-not-allowed w-full max-w-sm";
            }
        }

        function checkAnswer() {
            if (userSelection.length !== wuduSteps.length) return;

            let isCorrect = true;
            for (let i = 0; i < wuduSteps.length; i++) {
                if (userSelection[i].id !== wuduSteps[i].id) {
                    isCorrect = false;
                    break;
                }
            }

            if (isCorrect) {
                playSound('correct');
                score += 10;
                document.getElementById('score').innerText = toHindiNumeral(score);
                showFeedback("أحسنت يا بطل! جميع خطوات الوضوء مرتبة بشكل صحيح 🌟", "text-green-700 bg-green-100 border-2 border-green-300");
                setTimeout(() => {
                    document.getElementById('success-modal').classList.remove('hidden');
                }, 800);
            } else {
                playSound('wrong');
                showFeedback("الترتيب غير صحيح، حاول مرة أخرى وركز في الخطوات! 🧐", "text-red-700 bg-red-100 border-2 border-red-300");
                const slots = document.getElementById('target-slots');
                slots.classList.add('shake');
                setTimeout(() => slots.classList.remove('shake'), 500);
            }
        }

        function showFeedback(msg, colorClass) {
            const feedbackEl = document.getElementById('feedback');
            feedbackEl.innerText = msg;
            feedbackEl.className = `min-h-[45px] sm:min-h-[55px] text-center font-black text-base sm:text-2xl transition-all flex items-center justify-center px-3 rounded-2xl ${colorClass}`;
        }

        function clearFeedback() {
            const feedbackEl = document.getElementById('feedback');
            feedbackEl.innerText = '';
        }

        function startNewGame() {
            initGame();
        }

        window.onload = () => {
            initGame();
        };
    </script>
</body>
</html>
