<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة معداد الأعداد التفاعلية - تصميم الأستاذ فادي أبو الكباش</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts for Arabic font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Canvas Confetti for celebrations -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            overflow-x: hidden;
        }

        .bead {
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s;
            cursor: pointer;
        }

        .bead:active {
            transform: scale(1.15);
        }

        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-3px, 0, 0); }
            20%, 80% { transform: translate3d(5px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-7px, 0, 0); }
            40%, 60% { transform: translate3d(7px, 0, 0); }
        }

        /* Responsive height adjustments for abacus rods & beads */
        .rod-height {
            height: clamp(170px, 32vh, 260px);
        }

        .bead-size {
            width: clamp(2.5rem, 8vw, 5rem);
            height: clamp(1.1rem, 2.8vh, 1.75rem);
        }

        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-between items-center p-2 sm:p-4 md:p-6">

    <!-- Top Header & Controls -->
    <header class="w-full max-w-4xl bg-white rounded-2xl sm:rounded-3xl shadow-lg p-3 sm:p-5 mb-3 sm:mb-4 flex flex-col md:flex-row justify-between items-center gap-3 sm:gap-4 border-2 sm:border-4 border-indigo-100">
        
        <div class="flex items-center gap-3 w-full md:w-auto justify-between md:justify-start">
            <div class="flex items-center gap-2 sm:gap-3">
                <div class="bg-indigo-600 text-white p-2.5 sm:p-3.5 rounded-xl sm:rounded-2xl shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-calculator text-2xl sm:text-4xl"></i>
                </div>
                <div>
                    <h1 class="text-lg sm:text-2xl md:text-3xl font-black text-slate-800">لعبة المعداد الذكي</h1>
                    <p class="text-xs sm:text-sm font-bold text-slate-500">مثل الأعداد على المعداد بأسلوب ممتع!</p>
                </div>
            </div>

            <!-- Score Badge on Mobile -->
            <div class="flex md:hidden items-center gap-3 bg-indigo-50 px-3 py-1.5 rounded-xl border border-indigo-100">
                <div class="text-center">
                    <span class="text-[10px] text-indigo-500 font-extrabold block">النقاط</span>
                    <span id="score-display-mobile" class="text-base font-black text-indigo-700">٠</span>
                </div>
                <div class="w-0.5 h-6 bg-indigo-200"></div>
                <div class="text-center">
                    <span class="text-[10px] text-emerald-500 font-extrabold block">الصح</span>
                    <span id="streak-display-mobile" class="text-base font-black text-emerald-600">٠ 🔥</span>
                </div>
            </div>
        </div>

        <!-- Level Selector -->
        <div class="flex items-center justify-center gap-1 sm:gap-2 bg-slate-100 p-1.5 sm:p-2 rounded-xl sm:rounded-2xl border-2 border-slate-200 w-full md:w-auto overflow-x-auto">
            <span class="text-xs sm:text-base font-black text-slate-700 px-1 sm:px-2 whitespace-nowrap">المنازل:</span>
            <button onclick="changeLevel(1)" id="lvl-1" class="lvl-btn text-xs sm:text-base font-black px-2.5 sm:px-3.5 py-1.5 sm:py-2 rounded-lg sm:rounded-xl transition-all whitespace-nowrap">منزلة</button>
            <button onclick="changeLevel(2)" id="lvl-2" class="lvl-btn text-xs sm:text-base font-black px-2.5 sm:px-3.5 py-1.5 sm:py-2 rounded-lg sm:rounded-xl transition-all whitespace-nowrap">منزلتان</button>
            <button onclick="changeLevel(3)" id="lvl-3" class="lvl-btn text-xs sm:text-base font-black px-2.5 sm:px-3.5 py-1.5 sm:py-2 rounded-lg sm:rounded-xl transition-all whitespace-nowrap">٣ منازل</button>
            <button onclick="changeLevel(4)" id="lvl-4" class="lvl-btn text-xs sm:text-base font-black px-2.5 sm:px-3.5 py-1.5 sm:py-2 rounded-lg sm:rounded-xl transition-all whitespace-nowrap">٤ منازل</button>
        </div>

        <!-- Score & Stats for Desktop/Tablet -->
        <div class="hidden md:flex items-center gap-4 sm:gap-5 bg-indigo-50 px-4 sm:px-5 py-2 sm:py-2.5 rounded-2xl border-2 border-indigo-100 shadow-inner">
            <div class="text-center">
                <span class="text-xs sm:text-sm text-indigo-500 font-extrabold block">النقاط</span>
                <span id="score-display" class="text-xl sm:text-3xl font-black text-indigo-700">٠</span>
            </div>
            <div class="w-1 h-8 sm:h-10 bg-indigo-200 rounded-full"></div>
            <div class="text-center">
                <span class="text-xs sm:text-sm text-emerald-500 font-extrabold block">الصح</span>
                <span id="streak-display" class="text-xl sm:text-3xl font-black text-emerald-600">٠ 🔥</span>
            </div>
        </div>
    </header>

    <!-- Main Game Area -->
    <main class="w-full max-w-4xl flex-1 flex flex-col items-center justify-center gap-3 sm:gap-5">
        
        <!-- Question Card -->
        <div class="w-full bg-white rounded-2xl sm:rounded-3xl shadow-xl p-4 sm:p-6 md:p-8 text-center border-2 sm:border-4 border-indigo-200 relative overflow-hidden">
            <div class="absolute -top-10 -right-10 w-28 sm:w-36 h-28 sm:h-36 bg-indigo-50 rounded-full blur-2xl"></div>
            <div class="absolute -bottom-10 -left-10 w-28 sm:w-36 h-28 sm:h-36 bg-purple-50 rounded-full blur-2xl"></div>

            <p class="text-base sm:text-xl md:text-2xl font-black text-slate-700 mb-1">مثل العدد التالي على المعداد:</p>
            <div id="target-number-display" class="text-4xl sm:text-6xl md:text-7xl font-black text-indigo-600 tracking-wider my-1 sm:my-3 drop-shadow-md">
                ٠٠
            </div>
            <p id="feedback-msg" class="text-sm sm:text-lg md:text-xl font-bold min-h-[1.75rem] sm:min-h-[2rem] text-slate-600 transition-all">
                ضع الخرزات في المنازل المناسبة!
            </p>
        </div>

        <!-- Abacus Visualization Container -->
        <div id="abacus-card" class="w-full bg-amber-50/90 rounded-2xl sm:rounded-3xl shadow-2xl p-3 sm:p-6 md:p-8 border-2 sm:border-4 border-amber-800/40 relative flex flex-col items-center justify-end">
            
            <!-- Abacus Top Bar -->
            <div class="w-full h-3 sm:h-5 bg-amber-900 rounded-full shadow-md mb-2 sm:mb-3"></div>

            <!-- Columns Container (Ordered from Right to Left: Ones -> Tens -> Hundreds -> Thousands) -->
            <div id="abacus-columns" class="w-full flex justify-around items-end px-1 sm:px-6 md:px-10 relative">
                <!-- Columns dynamically generated by JS -->
            </div>

            <!-- Abacus Wooden Base -->
            <div class="w-full h-10 sm:h-12 bg-gradient-to-r from-amber-950 via-amber-900 to-amber-950 rounded-xl sm:rounded-2xl shadow-2xl border-t-2 sm:border-t-4 border-amber-700 flex justify-around items-center px-2 sm:px-4 relative z-10 mt-1">
                <div class="w-full flex justify-around text-white font-black text-xs sm:text-xl md:text-2xl" id="base-labels">
                    <!-- Base labels dynamically generated -->
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="w-full flex flex-wrap justify-center gap-2 sm:gap-4 mt-1 sm:mt-2">
            <button onclick="checkAnswer()" class="flex-1 min-w-[140px] max-w-sm bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-black text-base sm:text-xl md:text-2xl py-3 sm:py-4 px-4 sm:px-8 rounded-xl sm:rounded-2xl shadow-xl shadow-emerald-500/30 transition-all flex items-center justify-center gap-2 sm:gap-3 border-b-4 border-emerald-700">
                <i class="fa-solid fa-circle-check text-xl sm:text-3xl"></i>
                تحقق من الإجابة
            </button>
            <button onclick="clearAbacus()" class="bg-rose-500 hover:bg-rose-600 active:scale-95 text-white font-black text-sm sm:text-lg md:text-xl py-3 sm:py-4 px-3 sm:px-6 rounded-xl sm:rounded-2xl shadow-lg shadow-rose-500/20 transition-all flex items-center justify-center gap-1 sm:gap-2 border-b-4 border-rose-700">
                <i class="fa-solid fa-rotate-right text-base sm:text-2xl"></i>
                مسح المعداد
            </button>
            <button onclick="generateQuestion()" class="bg-slate-700 hover:bg-slate-800 active:scale-95 text-white font-black text-sm sm:text-lg md:text-xl py-3 sm:py-4 px-3 sm:px-6 rounded-xl sm:rounded-2xl shadow-lg shadow-slate-700/20 transition-all flex items-center justify-center gap-1 sm:gap-2 border-b-4 border-slate-900">
                <i class="fa-solid fa-forward text-base sm:text-2xl"></i>
                سؤال جديد
            </button>
        </div>

    </main>

    <!-- Footer with Teacher's Name -->
    <footer class="mt-4 sm:mt-8 text-center flex flex-col items-center gap-1 sm:gap-2">
        <div class="bg-white/90 backdrop-blur border-2 border-indigo-100 shadow-md px-4 sm:px-8 py-2 sm:py-3 rounded-xl sm:rounded-2xl flex items-center gap-2 sm:gap-3 text-slate-800 font-extrabold text-sm sm:text-lg md:text-xl">
            <i class="fa-solid fa-graduation-cap text-indigo-600 text-lg sm:text-2xl"></i>
            <span>تصميم الأستاذ: <span class="text-indigo-600 font-black">فادي أبو الكباش</span></span>
        </div>
        <span class="text-[10px] sm:text-sm font-bold text-slate-400">وسيلة تعليمية تفاعلية لترتيب الأعداد على المعداد للأطفال 🎈</span>
    </footer>

    <!-- Audio Elements for Effects -->
    <script>
        // Helper function to convert Western digits to Eastern Arabic digits (Hindi numbers)
        function toHindiNumeral(num) {
            const hindiDigits = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
            return String(num).replace(/[0-9]/g, (w) => hindiDigits[parseInt(w)]);
        }

        // Web Audio API Sound Generator
        class SoundFX {
            constructor() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }

            playBeadAdd() {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }

            playBeadRemove() {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }

            playSuccess() {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const now = this.ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                    gain.gain.setValueAtTime(0.3, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.3);
                });
            }

            playError() {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.setValueAtTime(140, now + 0.15);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.35);
            }
        }

        const sound = new SoundFX();

        // Place value configuration (0: Ones, 1: Tens, 2: Hundreds, 3: Thousands)
        const PLACE_CONFIG = [
            { id: 'ones', label: 'الآحاد', color: 'bg-rose-500', borderColor: 'border-rose-600', shadow: 'shadow-rose-500/40' },
            { id: 'tens', label: 'العشرات', color: 'bg-sky-500', borderColor: 'border-sky-600', shadow: 'shadow-sky-500/40' },
            { id: 'hundreds', label: 'المئات', color: 'bg-emerald-500', borderColor: 'border-emerald-600', shadow: 'shadow-emerald-500/40' },
            { id: 'thousands', label: 'الألوف', color: 'bg-amber-500', borderColor: 'border-amber-600', shadow: 'shadow-amber-500/40' }
        ];

        // Game State
        let currentLevel = 2; // Default 2 places (ones, tens)
        let targetNumber = 0;
        let abacusState = [0, 0, 0, 0]; // beads count for [ones, tens, hundreds, thousands]
        let score = 0;
        let streak = 0;

        // Initialize Game
        window.onload = () => {
            changeLevel(2, false);
        };

        function changeLevel(level, generate = true) {
            currentLevel = level;
            
            // Update active level buttons UI
            for(let i=1; i<=4; i++) {
                const btn = document.getElementById(`lvl-${i}`);
                if(i === level) {
                    btn.className = "lvl-btn text-xs sm:text-base font-black px-2.5 sm:px-3.5 py-1.5 sm:py-2 rounded-lg sm:rounded-xl transition-all bg-indigo-600 text-white shadow-md shadow-indigo-500/30 scale-105 whitespace-nowrap";
                } else {
                    btn.className = "lvl-btn text-xs sm:text-base font-black px-2.5 sm:px-3.5 py-1.5 sm:py-2 rounded-lg sm:rounded-xl transition-all text-slate-700 hover:bg-slate-200 whitespace-nowrap";
                }
            }

            if(generate) {
                generateQuestion();
            } else {
                renderAbacus();
            }
        }

        function generateQuestion() {
            clearAbacus(false);

            // Generate number based on level
            let min = Math.pow(10, currentLevel - 1);
            let max = Math.pow(10, currentLevel) - 1;
            
            if(currentLevel === 1) min = 1;

            targetNumber = Math.floor(Math.random() * (max - min + 1)) + min;

            // Render Target Number in Hindi Numerals
            document.getElementById('target-number-display').innerText = toHindiNumeral(targetNumber);
            
            // Feedback reset
            const msg = document.getElementById('feedback-msg');
            msg.innerText = "ضع الخرزات في المنازل المناسبة!";
            msg.className = "text-sm sm:text-lg md:text-xl font-bold min-h-[1.75rem] sm:min-h-[2rem] text-slate-600 transition-all";

            renderAbacus();
        }

        function clearAbacus(playSound = true) {
            abacusState = [0, 0, 0, 0];
            if(playSound) sound.playBeadRemove();
            renderBeads();
        }

        function renderAbacus() {
            const columnsContainer = document.getElementById('abacus-columns');
            const baseLabels = document.getElementById('base-labels');

            columnsContainer.innerHTML = '';
            baseLabels.innerHTML = '';

            // Render columns from RIGHT to LEFT:
            // Rightmost: index 0 (Ones)
            // Leftwards: index 1 (Tens), index 2 (Hundreds), index 3 (Thousands)
            for (let i = 0; i < currentLevel; i++) {
                const config = PLACE_CONFIG[i];

                // Column HTML
                const colDiv = document.createElement('div');
                colDiv.className = `flex flex-col items-center justify-end relative group px-0.5 sm:px-3 cursor-pointer`;
                colDiv.style.flex = "1";
                colDiv.setAttribute('onclick', `addBead(${i})`);

                colDiv.innerHTML = `
                    <!-- Metal Rod -->
                    <div class="w-2.5 sm:w-3.5 bg-gradient-to-r from-slate-300 via-slate-100 to-slate-400 rounded-t-full rod-height shadow-md relative flex flex-col justify-end items-center pb-1">
                        
                        <!-- Bead Drop Zone / Column Click Target -->
                        <div id="rod-beads-${i}" class="w-full flex flex-col-reverse items-center gap-0.5 sm:gap-1 z-10">
                            <!-- Beads injected here -->
                        </div>
                    </div>

                    <!-- Add/Remove Quick Buttons -->
                    <div class="flex items-center gap-1 sm:gap-2 mt-2 sm:mt-3 z-20" onclick="event.stopPropagation()">
                        <button onclick="removeBead(${i})" class="w-7 h-7 sm:w-10 sm:h-10 rounded-full bg-slate-200 hover:bg-rose-500 hover:text-white text-slate-800 font-black flex items-center justify-center transition-all shadow-md text-xs sm:text-lg border border-slate-300" title="إزالة خرزة">
                            <i class="fa-solid fa-minus"></i>
                        </button>
                        <button onclick="addBead(${i})" class="w-7 h-7 sm:w-10 sm:h-10 rounded-full bg-slate-200 hover:bg-emerald-500 hover:text-white text-slate-800 font-black flex items-center justify-center transition-all shadow-md text-xs sm:text-lg border border-slate-300" title="إضافة خرزة">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </div>
                `;

                columnsContainer.appendChild(colDiv);

                // Base Label HTML
                const labelDiv = document.createElement('div');
                labelDiv.className = `text-center flex-1 font-black text-xs sm:text-xl md:text-2xl tracking-wide`;
                labelDiv.innerText = config.label;
                baseLabels.appendChild(labelDiv);
            }

            renderBeads();
        }

        function addBead(placeIndex) {
            if (abacusState[placeIndex] < 9) {
                abacusState[placeIndex]++;
                sound.playBeadAdd();
                renderBeads();
            } else {
                sound.playError();
            }
        }

        function removeBead(placeIndex) {
            if (abacusState[placeIndex] > 0) {
                abacusState[placeIndex]--;
                sound.playBeadRemove();
                renderBeads();
            }
        }

        function renderBeads() {
            for (let i = 0; i < currentLevel; i++) {
                const rod = document.getElementById(`rod-beads-${i}`);
                if (!rod) continue;

                rod.innerHTML = '';
                const config = PLACE_CONFIG[i];
                const count = abacusState[i];

                // Render beads bottom-up
                for (let b = 0; b < count; b++) {
                    const bead = document.createElement('div');
                    bead.className = `bead bead-size ${config.color} ${config.borderColor} border-2 rounded-full shadow-md ${config.shadow} flex items-center justify-center relative transform hover:scale-105`;
                    
                    bead.innerHTML = `
                        <div class="w-full h-1/3 bg-white/40 rounded-full absolute top-0.5"></div>
                    `;

                    // Click bead to remove it
                    bead.onclick = (e) => {
                        e.stopPropagation();
                        removeBead(i);
                    };

                    rod.appendChild(bead);
                }
            }
        }

        function checkAnswer() {
            // Calculate current value from abacusState
            let userTotal = 0;
            for(let i = 0; i < currentLevel; i++) {
                userTotal += abacusState[i] * Math.pow(10, i);
            }

            const msg = document.getElementById('feedback-msg');
            const abacusCard = document.getElementById('abacus-card');

            if (userTotal === targetNumber) {
                // CORRECT ANSWER
                sound.playSuccess();
                score += 10;
                streak++;

                const hindiScore = toHindiNumeral(score);
                const hindiStreak = toHindiNumeral(streak);

                document.getElementById('score-display').innerText = hindiScore;
                document.getElementById('streak-display').innerText = `${hindiStreak} 🔥`;
                document.getElementById('score-display-mobile').innerText = hindiScore;
                document.getElementById('streak-display-mobile').innerText = `${hindiStreak} 🔥`;

                msg.innerText = "🌟 أحسنت! إجابة صحيحة ورائعة! 🎉";
                msg.className = "text-lg sm:text-2xl font-black min-h-[1.75rem] sm:min-h-[2rem] text-emerald-600 transition-all animate-bounce";

                // Confetti Animation
                confetti({
                    particleCount: 90,
                    spread: 80,
                    origin: { y: 0.6 }
                });

                // Auto next question after delay
                setTimeout(() => {
                    generateQuestion();
                }, 1800);

            } else {
                // WRONG ANSWER
                sound.playError();
                streak = 0;
                document.getElementById('streak-display').innerText = `٠ 🔥`;
                document.getElementById('streak-display-mobile').innerText = `٠ 🔥`;

                msg.innerText = "حاول مرة أخرى! اضبط الخرزات لتصل للعدد المطلوب. 💪";
                msg.className = "text-sm sm:text-xl font-black min-h-[1.75rem] sm:min-h-[2rem] text-rose-600 transition-all";

                // Shake Abacus Card
                abacusCard.classList.add('shake');
                setTimeout(() => abacusCard.classList.remove('shake'), 500);
            }
        }
    </script>
</body>
</html>
