<p>🎚️ تيار القاعدة B: <b id="v">0</b>%</p><input type="range" id="sl" min="0" max="100" value="0"><svg viewBox="0 0 160 90" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" style="max-width:240px"><circle id="lg" cx="62" cy="45" r="34" fill="#ffee58" stroke="none" opacity="0" style="transition:opacity .3s"/><path d="M8 45H40M84 45H112M84 25V65"/><polygon points="40,25 40,65 84,45"/><path d="M70 20l16-14M86 6h-9M86 6v9M82 28l16-14M98 14h-9M98 14v9" stroke="#f9a825"/><text x="12" y="38" stroke="none">+</text><text x="102" y="38" stroke="none">−</text></svg><div class="info" id="st">المقبض مغلق: لا يمر تيار كبير.</div>`,i(){document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{$('#inf').textContent=b.dataset.l;say(b.dataset.l)});$('#sl').oninput=e=>{const v=+e.target.value;$('#v').textContent=v;$('#lg').style.opacity=v<15?0:.25+v/135;$('#st').textContent=v<15?'تيار القاعدة ضعيف: الـ LED مطفأ.':v<60?'تيار صغير في القاعدة يسمح بتيار أكبر: الـ LED يضيء.':'تيار القاعدة قوي: الـ LED ساطع!'}}},

{t:'سجّل ملاحظاتك',n:'اكتب ملاحظاتك في التقرير. أدخل اسمك وصفك، وراجع نتائج التجربة. ثم أجب عن السؤال: أين يمكن استعمال هذا التطبيق في الحياة العملية؟ وهل يمكن تطبيقه في الزراعة؟',h:()=>`<input id="nm" placeholder="اسم الطالب/ة"><input id="cl" placeholder="الصف"><table><tr><th>الحالة</th><th>حالة الـ LED</th></tr>${['قطبان جافان','ماء الصنبور','ماء مالح','ماء مقطر'].map(k=>`<tr><td>${k}</td><td>${LOG[k]||'— لم تجرّب بعد'}</td></tr>`).join('')}</table><p><b>ماذا لاحظت عند غمس القطبين في الماء؟ ولماذا؟</b></p><textarea id="ob" rows="2" placeholder="لاحظت أن..."></textarea><p><b>أين نستعمل هذا التطبيق؟ هل يفيد في الزراعة؟</b></p><textarea id="us" rows="2" placeholder="يمكن استعماله في..."></textarea><div class="info">💡 <b>هل تعلم؟</b> علم الاستشعار يتيح للدارات الإحساس بالرطوبة أو بقرب إنسان من الباب. القطعة التي تستشعر تسمى «مجس».</div><div class="row"><button id="cp">📋 انسخ التقرير</button></div><div id="ms"></div>`,i(){$('#cp').onclick=()=>{const T=`تقرير تجربة: دارة ترانزستور للاستشعار\nالطالب/ة: ${$('#nm').value} – الصف: ${$('#cl').value}\n`+Object.entries(LOG).map(([a,b])=>`${a}: ${b}`).join('\n')+`\nالملاحظة: ${$('#ob').value}\nالاستعمال: ${$('#us').value}`;try{navigator.clipboard.writeText(T).then(()=>$('#ms').textContent='✅ تم النسخ!',()=>$('#ms').textContent=T)}catch(e){$('#ms').textContent=T}addP(5)}}},
{t:'🎮 لعبة: سباق القطع',n:'لعبة سباق القطع. لديك خمس وعشرون ثانية. اقرأ الوصف واضغط على القطعة المناسبة بأسرع ما تستطيع.',h:()=>`<div class="row"><b>⏱️ <span id="tm">25</span></b> &nbsp; <b>✅ <span id="gs">0</span></b></div><div class="info" id="pq" style="font-size:19px;text-align:center">اضغط ابدأ</div><div class="grid" id="gb"></div><div class="row"><button id="gs0">▶ ابدأ اللعبة</button></div>`,i(){const P=[['أريد مفتاحًا إلكترونيًا يتحكم بالتيار',1],['أريد قطعة تضيء',2],['أريد مصدر طاقة 9 فولت',5],['أريد مقاومة 330 أوم لحماية الـ LED',3],['أريد وصل القطع ببعضها',0],['أريد مقاومة 1 كيلو أوم عند القاعدة',4]];let s,t,c;function nx(){c=P[Math.floor(Math.random()*6)];$('#pq').textContent=c[0]}

 gt=setInterval(()=>{t--;$('#tm').textContent=t;if(t<=0){clearInterval(gt);$('#pq').textContent='انتهى الوقت! أجبت '+s+' إجابات صحيحة 🎉';addP(s*2);boom();say('انتهى الوقت. أحسنت!')}},1000)}}},
{t:'اختبر نفسك',n:'حان وقت الاختبار. اختر الإجابة الصحيحة.',h:()=>'<div id="q"></div>',i:()=>quiz()},
{t:'أحسنت يا مهندس!',n:'',h:()=>`<div class="big">🏆</div><h2 style="text-align:center">نتيجتك: <span id="sc"></span> من ${Q.length}</h2><div class="info"><b>🧪 مهمة المختبر:</b> صوّر حالة الدارة قبل لمس الأقطاب وبعده، وانقل التقرير إلى ملف إلكتروني، وأضف الصور مع الشرح، واحفظه في مجلدك الخاص.</div><div class="row"><button id="rs">🔄 أعد الدرس</button></div>`,i(){$('#sc').textContent=score;$('#rs').onclick=()=>{score=0;qi=0;pts=0;addP(0);built=false;for(const k in LOG)delete LOG[k];go(0)};say(score>=5?'ما شاء الله، أحسنت! أنت مهندس إلكترونيات ماهر. لا تنس مهمة المختبر.':'جهد طيب! أعد الدرس لتتقن الدارة، ثم نفذ مهمة المختبر.')}}];
