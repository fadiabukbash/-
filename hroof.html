<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بَطَلُ الحُرُوفِ: لُعْبَةُ تَقْطِيعِ الكَلِمَاتِ المُمْتِعَةِ</title>
    <!-- خط القاهرة من Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
    <!-- مكتبة التأثيرات الاحتفالية والرسائل -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #a8edf0 0%, #fed6e3 100%);
            margin: 0;
            padding: clamp(8px, 2vw, 20px);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .game-card {
            background: #ffffff;
            border-radius: clamp(20px, 4vw, 35px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
            width: 100%;
            max-width: 850px;
            padding: clamp(15px, 3vw, 30px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(12px, 2.5vw, 22px);
            border: clamp(4px, 1vw, 7px) solid #ffeb3b;
        }

        /* الهيدر وشريط النقاط */
        .header-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff9c4;
            padding: clamp(8px, 2vw, 14px) clamp(12px, 3vw, 25px);
            border-radius: clamp(14px, 3vw, 22px);
            border: 3px dashed #fbc02d;
            gap: 10px;
        }

        .title-box {
            font-size: clamp(0.95rem, 3.2vw, 1.5rem);
            font-weight: 900;
            color: #d81b60;
            display: flex;
            align-items: center;
            gap: 8px;
            line-height: 1.2;
        }

        .stars-box {
            font-size: clamp(0.9rem, 3vw, 1.4rem);
            font-weight: 800;
            color: #f57f17;
            background: #fff;
            padding: 4px clamp(10px, 2vw, 18px);
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            white-space: nowrap;
            shrink: 0;
        }

        /* عرض الكلمة الرئيسية */
        .word-display-container {
            background: #e3f2fd;
            border: clamp(3px, 0.8vw, 5px) solid #64b5f6;
            border-radius: clamp(18px, 3vw, 28px);
            padding: clamp(12px, 2.5vw, 22px) clamp(15px, 4vw, 40px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.05);
            width: 100%;
        }

        .instruction {
            font-size: clamp(0.95rem, 2.8vw, 1.25rem);
            font-weight: 800;
            color: #1565c0;
            text-align: center;
        }

        .target-word {
            font-size: clamp(2.4rem, 8vw, 4rem);
            font-weight: 900;
            color: #283593;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0px #ffffff;
            line-height: 1.3;
        }

        /* منطقة الخانات الفارغة للتقطيع */
        .slots-container {
            display: flex;
            justify-content: center;
            gap: clamp(8px, 2vw, 18px);
            margin: 5px 0;
            width: 100%;
            flex-wrap: wrap;
        }

        .slot-box {
            width: clamp(60px, 16vw, 90px);
            height: clamp(70px, 18vw, 100px);
            border: clamp(3px, 0.8vw, 5px) dashed #ab47bc;
            background-color: #f3e5f5;
            border-radius: clamp(14px, 2.5vw, 22px);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: all 0.2s ease;
        }

        .slot-box.drag-over {
            background-color: #e1bee7;
            transform: scale(1.05);
            border-color: #7b1fa2;
        }

        .slot-box.filled {
            border-style: solid;
            border-color: #4caf50;
            background-color: #e8f5e9;
        }

        /* حروف خزانة الاختيار */
        .letters-pool-container {
            background: #fff3e0;
            border: 3px solid #ffb74d;
            border-radius: clamp(16px, 3vw, 24px);
            padding: clamp(12px, 2.5vw, 20px);
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .letters-pool {
            display: flex;
            justify-content: center;
            gap: clamp(8px, 2vw, 18px);
            flex-wrap: wrap;
            min-height: clamp(70px, 18vw, 100px);
            width: 100%;
            align-items: center;
        }

        /* الحرف القابل للسحب والنقر */
        .letter-card {
            width: clamp(58px, 15vw, 85px);
            height: clamp(65px, 16.5vw, 90px);
            background: linear-gradient(180deg, #ff7043 0%, #d84315 100%);
            color: white;
            font-size: clamp(2rem, 5.5vw, 3rem);
            font-weight: 900;
            border-radius: clamp(12px, 2.5vw, 20px);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 6px 0 #bf360c, 0 8px 12px rgba(0,0,0,0.18);
            transition: transform 0.15s, box-shadow 0.15s;
            position: relative;
        }

        .letter-card:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #bf360c, 0 4px 8px rgba(0,0,0,0.18);
        }

        .letter-card.placed {
            background: linear-gradient(180deg, #66bb6a 0%, #2e7d32 100%);
            box-shadow: 0 5px 0 #1b5e20;
            cursor: pointer;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* أدوات التحكم */
        .controls {
            display: flex;
            gap: clamp(8px, 2vw, 16px);
            width: 100%;
        }

        .btn {
            flex: 1;
            padding: clamp(10px, 2vw, 16px);
            font-size: clamp(1rem, 3vw, 1.35rem);
            font-weight: 900;
            font-family: 'Cairo', sans-serif;
            border: none;
            border-radius: clamp(12px, 2.5vw, 18px);
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 5px 0 rgba(0,0,0,0.15);
        }

        .btn-check {
            background: #43a047;
            color: white;
            box-shadow: 0 5px 0 #1b5e20;
        }
        .btn-check:hover { background: #388e3c; }

        .btn-next {
            background: #ff9800;
            color: white;
            box-shadow: 0 5px 0 #e65100;
        }
        .btn-next:hover { background: #f57c00; }

        .hint {
            font-size: clamp(0.85rem, 2.2vw, 1.05rem);
            color: #555;
            font-weight: 700;
            text-align: center;
        }

        /* الحقوق وتصميم الأستاذ - متجاوب وفي سطر واحد */
        .designer-credit {
            margin-top: 2px;
            font-size: clamp(0.75rem, 2.4vw, 1.05rem);
            font-weight: 900;
            color: #1e3a8a;
            background: #e0e7ff;
            padding: clamp(6px, 1.5vw, 10px) clamp(14px, 3vw, 24px);
            border-radius: 50px;
            border: 2px solid #818cf8;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

<div class="game-card">
    <div class="header-bar">
        <div class="title-box">🧩 بَطَلُ الحُرُوفِ: لُعْبَةُ تَقْطِيعِ الكَلِمَاتِ</div>
        <div class="stars-box">النجوم: <span id="score">0</span> ⭐</div>
    </div>

    <div class="word-display-container">
        <div class="instruction">قطع الكلمة التالية بحركاتها إلى خاناتها الصحيحة:</div>
        <div class="target-word" id="target-word">كَتَبَ</div>
    </div>

    <div class="slots-container" id="slots-container">
        <!-- يتم إنشاء الخانات الفارغة هنا ديناميكياً -->
    </div>

    <div class="letters-pool-container">
        <div class="hint">💡 اضغط على الحرف أو اسحبه ليوضع في الخانة المناسبة:</div>
        <div class="letters-pool" id="letters-pool">
            <!-- يتم وضع الحروف المبعثرة هنا -->
        </div>
    </div>

    <div class="controls">
        <button class="btn btn-check" onclick="checkAnswer()">تحقق من الحل ✅</button>
        <button class="btn btn-next" onclick="nextWord()">كلمة جديدة 🔄</button>
    </div>

    <div class="designer-credit">
        <span>✨ تصميم الأستاذ: فادي أبو الكباش ✨</span>
    </div>
</div>

<script>
    // قائمة الكلمات المخصصة للصف الأول مع الحركات الكاملة
    const wordList = [
        "كَتَبَ",
        "قَرَأَ",
        "رَسَمَ",
        "شَرِبَ",
        "لَعِبَ",
        "دَرَسَ",
        "جَلَسَ",
        "عَلِمَ",
        "سَمِعَ",
        "أَكَلَ",
        "وَجَدَ",
        "فَتَحَ"
    ];

    let currentWord = "";
    let wordParts = []; // الحروف مقطعة مع حركاتها
    let shuffledParts = [];
    let userAnswers = [];
    let score = 0;

    // محاكاة الأصوات التفاعلية لتشغيلها مباشرة دون روابط خارجية
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'pop') {
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        } else if (type === 'remove') {
            osc.frequency.setValueAtTime(500, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        } else if (type === 'win') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
            osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.35);
        } else if (type === 'error') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(160, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }
    }

    // دالة لتفكيك الكلمة العربية إلى حروفها بالحركات
    function splitArabicWord(word) {
        const parts = [];
        let currentPart = "";

        for (let i = 0; i < word.length; i++) {
            const char = word[i];
            // إذا كان الحرف حركة (فتحة، ضمة، كسرة، سكون، تنوين، شدة)
            if (/[\u064B-\u0652]/.test(char)) {
                currentPart += char;
            } else {
                if (currentPart !== "") {
                    parts.push(currentPart);
                }
                currentPart = char;
            }
        }
        if (currentPart !== "") {
            parts.push(currentPart);
        }
        return parts;
    }

    // خلط عناصر المصفوفة عشوائياً
    function shuffleArray(array) {
        return array.slice().sort(() => Math.random() - 0.5);
    }

    // بدء سؤال جديد
    function nextWord() {
        const randomIndex = Math.floor(Math.random() * wordList.length);
        currentWord = wordList[randomIndex];
        document.getElementById('target-word').innerText = currentWord;

        wordParts = splitArabicWord(currentWord);
        userAnswers = new Array(wordParts.length).fill(null);

        shuffledParts = shuffleArray(wordParts.map((text, id) => ({ text, id })));

        renderGame();
    }

    // رسم واجهة الخانات والحروف
    function renderGame() {
        const slotsContainer = document.getElementById('slots-container');
        const lettersPool = document.getElementById('letters-pool');

        slotsContainer.innerHTML = '';
        lettersPool.innerHTML = '';

        // إنشاء الخانات الفارغة (بالترتيب من اليمين لليسار)
        wordParts.forEach((_, index) => {
            const slot = document.createElement('div');
            slot.className = 'slot-box' + (userAnswers[index] ? ' filled' : '');
            slot.dataset.index = index;

            // السماح بالإفلات
            slot.ondragover = (e) => { e.preventDefault(); slot.classList.add('drag-over'); };
            slot.ondragleave = () => slot.classList.remove('drag-over');
            slot.ondrop = (e) => handleDrop(e, index);

            // إذا كانت الخانة تعبأت بحرف
            if (userAnswers[index]) {
                const letterCard = createLetterElement(userAnswers[index].text, userAnswers[index].id, true, index);
                slot.appendChild(letterCard);
            }

            slotsContainer.appendChild(slot);
        });

        // إنشاء الحروف في الخزانة السفلية
        shuffledParts.forEach(item => {
            const isUsed = userAnswers.some(ans => ans && ans.id === item.id);
            if (!isUsed) {
                const letterCard = createLetterElement(item.text, item.id, false);
                lettersPool.appendChild(letterCard);
            }
        });
    }

    // إنشاء عنصر الحرف
    function createLetterElement(text, id, isPlaced, slotIndex = null) {
        const card = document.createElement('div');
        card.className = 'letter-card' + (isPlaced ? ' placed' : '');
        card.innerText = text;
        card.draggable = true;

        // أحداث السحب
        card.ondragstart = (e) => {
            e.dataTransfer.setData('text/plain', JSON.stringify({ id, text, fromSlot: slotIndex }));
        };

        // أحداث الضغط (للأجهزة اللوحية وتسهيل اللعب)
        card.onclick = () => {
            if (isPlaced) {
                playSound('remove');
                userAnswers[slotIndex] = null;
                renderGame();
            } else {
                const emptyIndex = userAnswers.findIndex(val => val === null);
                if (emptyIndex !== -1) {
                    playSound('pop');
                    userAnswers[emptyIndex] = { id, text };
                    renderGame();
                } else {
                    playSound('error');
                }
            }
        };

        return card;
    }

    // التعامل مع إفلات الحرف في الخانة
    function handleDrop(e, slotIndex) {
        e.preventDefault();
        document.querySelectorAll('.slot-box').forEach(s => s.classList.remove('drag-over'));

        const data = JSON.parse(e.dataTransfer.getData('text/plain'));

        if (data.fromSlot !== null) {
            userAnswers[data.fromSlot] = null;
        }

        playSound('pop');
        userAnswers[slotIndex] = { id: data.id, text: data.text };
        renderGame();
    }

    // التحقق من صحة إجابة الطفل
    function checkAnswer() {
        const isComplete = userAnswers.every(ans => ans !== null);

        if (!isComplete) {
            playSound('error');
            Swal.fire({
                title: 'أَكْمِلْ تَقْطِيعَ الكَلِمَةِ! 🧩',
                text: 'اسحب كل الحروف أو اضغط عليها لتضعها في خاناتها أولاً.',
                icon: 'warning',
                confirmButtonText: 'حسناً 👍',
                confirmButtonColor: '#ff9800'
            });
            return;
        }

        const userWord = userAnswers.map(ans => ans.text).join('');

        if (userWord === currentWord) {
            playSound('win');
            score += 10;
            document.getElementById('score').innerText = score;

            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });

            Swal.fire({
                title: 'بَطَلٌ مُتَفَوِّقٌ! 🥳✨',
                text: `أَحْسَنْتَ! قَطَّعْتَ كَلِمَةَ (${currentWord}) بِشَكْلٍ صَحِيحٍ!`,
                icon: 'success',
                confirmButtonText: 'الكَلِمَةُ التَّالِيَةُ 🎯',
                confirmButtonColor: '#43a047'
            }).then(() => nextWord());
        } else {
            playSound('error');
            Swal.fire({
                title: 'حَاوِلْ مَرَّةً أُخْرَى! 🤔',
                text: 'ترتيب الحروف أو المقاطع ليس صحيحاً تماماً، اضغط على الحرف المخطئ لإعادته.',
                icon: 'error',
                confirmButtonText: 'تَصْحِيحُ الخَطَأ ✏️',
                confirmButtonColor: '#d32f2f'
            });
        }
    }

    window.onload = nextWord;
</script>

</body>
</html>
