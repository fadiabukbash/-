:root[data-theme="dark"]{--bg:#0d1917;--card:#152623;--tx:#e6f3ef;--mut:#a4c2bb;--bd:#264640;--ac:#4cc9b8;--hd:#07201e}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tajawal,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.9;font-size:17px}
header{background:var(--hd);color:#fff;padding:22px 16px 18px;text-align:center}
header h1{margin:0 0 4px;font-size:clamp(24px,5vw,38px);font-weight:800}

.top{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.pill{background:#ffffff22;border-radius:30px;padding:2px 14px;font-weight:700}
button{font:inherit;cursor:pointer;color:inherit}

#sub{padding-top:0}#sub button{border-radius:30px;font-size:15px;border-style:dashed}#sub button.on{border-style:solid}
main{max-width:1000px;margin:auto;padding:0 12px 20px}
.intro{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 16px;margin-bottom:12px;color:var(--mut)}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 18px;margin-bottom:14px}

ul,ol{margin:0;padding-inline-start:22px}li{margin-bottom:4px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:4px 14px;font-weight:700}
.btn.o{background:transparent;color:var(--ac);border:2px solid var(--ac)}
.sc{width:100%;height:auto;border-radius:12px;display:block;border:1px solid var(--bd)}
.pt{opacity:.12;transition:opacity .5s}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:2px dashed var(--ac);background:transparent;border-radius:10px;padding:2px 12px;font-weight:700}
.chip.on{background:var(--ac);color:#fff;border-style:solid}
.ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ctl input{flex:1 1 180px;accent-color:var(--ac);direction:ltr}
.val{min-width:90px;font-weight:800;color:var(--ac)}
.gauge{height:18px;border-radius:10px;background:var(--bd);overflow:hidden;margin:8px 0}
.gauge i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f4b400,#2e9e5b);transition:width .2s}
.st{font-weight:700;min-height:3.4em}
.ex{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.ex div{background:var(--bg);border-radius:12px;padding:8px 12px}
.q button{display:block;width:100%;text-align:start;background:var(--bg);border:2px solid var(--bd);border-radius:10px;padding:4px 12px;margin:6px 0}
.q button.ok{border-color:#2e9e5b;background:#2e9e5b33}.q button.no{border-color:#d64545;background:#d6454533}
#md{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
#md.on{display:flex}
#mb{background:var(--card);border-radius:18px;padding:20px;max-width:520px;width:100%;text-align:center;max-height:92vh;overflow:auto}
#mi{font-size:64px;display:inline-block;animation:sp 3s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pu{50%{transform:scale(1.25)}}
#mi.pu{animation:pu 1.2s ease-in-out infinite}
#mn{font-size:44px;font-weight:800;color:var(--ac)}
footer{background:var(--hd);color:#fff;text-align:center;padding:16px;font-weight:700}
footer small{display:block;opacity:.8;font-weight:400}
@media (prefers-reduced-motion:reduce){#mi{animation:none}}

sl:{l:'سرعة الرياح',u:'م/ث',min:0,max:30,v:8},
sum:['تُعدّ طاقة الرياح من أقدم مصادر الطاقة التي استخدمها الإنسان؛ فقد استُخدمت في طحن الحبوب وتسيير السفن الشراعية وضخّ المياه.','في وقتنا الحاضر تُولَّد الكهرباء بالعنفات الهوائية، إذ تتحوّل الطاقة الحركية للرياح إلى حركة دورانية للمراوح.','يتصل عمود المراوح بمولّد ينتج الطاقة الكهربائية، ويُتحكَّم بسرعة الدوران بالفرامل عند اشتداد الرياح، أو تُوقَف العنفة عند حدوث العواصف.','يُشترط وجود مناطق تهبّ فيها الرياح بسرعة معتدلة خلال العام.'],

function audio(){if(AC)return;AC=new (window.AudioContext||window.webkitAudioContext)();const b=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;nz=AC.createBufferSource();nz.buffer=b;nz.loop=true;flt=AC.createBiquadFilter();flt.type='bandpass';ng=AC.createGain();ng.gain.value=0;nz.connect(flt);flt.connect(ng);ng.connect(AC.destination);nz.start();osc=AC.createOscillator();osc.type='sine';og=AC.createGain();og.gain.value=0;osc.connect(og);og.connect(AC.destination);osc.start()}
